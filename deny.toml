# cargo-deny (CI job "deny"): known vulnerabilities and unmaintained crates (RustSec), licences, duplicate or banned
# crates, and where crates come from. Blocking.
[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
unused-allowed-license = "allow"
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
