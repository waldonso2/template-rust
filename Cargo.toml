[package]
name = "tool" # PLACEHOLDER: the project's name
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "PLACEHOLDER"
license = "MIT"
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# CI runs clippy with -D warnings: every warning blocks. A deliberate exception: #[allow(clippy::<lint>)] // why
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stderr = "allow"

[profile.release]
overflow-checks = true
